# Local Docker setup: Django (web) + PostgreSQL (db) + Redis (redis)
# + Celery worker (celery) and scheduler (celery-beat)
# + Stripe CLI (stripe-cli), which forwards Stripe webhooks to web.
#
#   docker compose up --build -d   build the web image and start everything
#   docker compose ps              state and health of the services
#   docker compose logs -f web     follow the Django / gunicorn output
#   docker compose logs -f stripe-cli   events from Stripe and web's answers
#   docker compose logs -f celery celery-beat   background tasks and the schedule
#   docker compose down            stop and remove the containers (volumes stay)
#   docker compose down -v         ... and delete static_data (the shared
#                                  database and covers stay: external)
#
# Variables like ${POSTGRES_DB} below are taken by docker compose from the
# .env file next to this file (the same .env Django reads).
#
# The services find each other by service name: inside the Docker network
# "db" and "redis" are host names (Docker's built-in DNS).

# The part shared by web, celery and celery-beat: one image (the same code),
# the same settings. "x-" = an extension field, ignored by compose itself;
# "&django" names it, "<<: *django" below copies its keys into a service.
x-django: &django
  # Image from the Dockerfile in this folder. One name for the three
  # services: built once, the others reuse it.
  build: .
  image: hillel-bookstore-django
  # All variables from .env go into the container (DJANGO_SECRET_KEY,
  # DJANGO_DEBUG, POSTGRES_*, ...). The .env file itself is not in the
  # image (.dockerignore).
  env_file: .env
  environment:
    # "environment" wins over "env_file": in .env the hosts are
    # "localhost" (for runserver on the Mac); inside the Docker network
    # PostgreSQL and Redis are reached by service name.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    # Redis database 0: cache + sessions; database 1: the Celery queue
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    # + "web": the stripe-cli service sends webhooks to http://web:8000/...,
    # so the Host header is "web"; any host not in ALLOWED_HOSTS gets 400
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS},web

services:
  db:
    # Official PostgreSQL image, Alpine variant (smaller).
    # A fixed major version: 17 data files can't be opened by 18 without
    # an upgrade, so the version must not change by itself.
    image: postgres:17-alpine
    environment:
      # On the FIRST start (empty volume) the image creates this database
      # and this user with this password. Later starts ignore them: the data
      # is already in the volume. Only these three, not the whole .env:
      # the database doesn't need DJANGO_SECRET_KEY.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Extra arguments for initdb, also used only on the FIRST start.
      # Ukrainian sorting rules (ICU) for the whole database. Without it the
      # Alpine image uses libc collation, and musl (Alpine's C library) has
      # no language rules: strings are compared by Unicode code points, so
      # "Іван" (І = U+0406) comes before "Андрій" (А = U+0410), lowercase
      # letters come after all uppercase ones, and "Ґ" (U+0490) is last.
      # ICU = a library with sorting rules for most languages, built into
      # this image (collation "uk-UA-x-icu").
      # Changing this line later does nothing to an existing database:
      # the db volume has to be deleted and the data loaded again.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=uk-UA"
    volumes:
      # Database files live in a named volume, not in the container:
      # they survive `docker compose down` and image updates.
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published to your Mac: runserver, tests and PyCharm's database
      # window connect to localhost:5432 (POSTGRES_HOST=localhost in .env).
      # If PostgreSQL is already installed on the Mac and uses 5432,
      # change the left number, e.g. "5433:5432", and POSTGRES_PORT=5433.
      - "5432:5432"
    healthcheck:
      # pg_isready: "does the server accept connections?" (exit code 0 = yes).
      # $$ = a literal $ for the shell inside the container: the variable is
      # read there at check time, not substituted by compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s        # check every 5 seconds
      timeout: 5s         # a check longer than this counts as failed
      retries: 5          # 5 failures in a row -> "unhealthy"
      start_period: 10s   # failures in the first 10 s don't count (start-up)

  redis:
    # Cache + sessions (CACHES / SESSION_ENGINE in settings.py).
    # No volume: the cache may be lost on restart; sessions are also in
    # PostgreSQL (cached_db), so nobody gets logged out.
    image: redis:8-alpine
    ports:
      # For runserver on the Mac: REDIS_URL=redis://localhost:6379/0
      - "6379:6379"
    healthcheck:
      # redis-cli ping -> "PONG" when the server works
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    # image, env_file, environment: from x-django above
    <<: *django
    ports:
      # http://localhost:8000 on the Mac -> gunicorn in the container
      - "8000:8000"
    volumes:
      # collectstatic output (docker-entrypoint.sh), served by WhiteNoise
      - static_data:/app/staticfiles
      # uploaded covers: survive rebuilding and recreating the container
      - media_data:/app/media
    healthcheck:
      # GET /health/ from inside the container (config/views.py: checks
      # PostgreSQL and Redis). The slim image has no curl or wget, so Python
      # does the request: urlopen raises an error for 503 or no answer ->
      # exit code 1 -> the check failed; 200 -> exit code 0.
      # "localhost" is allowed by DJANGO_ALLOWED_HOSTS in .env.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      # migrate + collectstatic + gunicorn start take a few seconds;
      # failures during this time don't count
      start_period: 30s
    depends_on:
      # Start web only when db and redis pass their healthchecks, not just
      # when their containers are started: PostgreSQL needs a few seconds
      # before it accepts connections, and migrate in docker-entrypoint.sh
      # would fail with "connection refused" (as in the stage 4 check).
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    # The worker: takes tasks from the queue (Redis db 1) and runs them:
    # emails, the daily report, cleanup. The same image and settings as web.
    <<: *django
    #   -A config          the Celery app in config/celery.py
    #   --concurrency=2    2 processes: 2 tasks at the same time
    #   --loglevel=info    "Task ... received / succeeded in 0.3s"
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      # "Are you alive?" to this worker over the broker; it answers "pong".
      # $$HOSTNAME: the container's host name, read inside the container;
      # the worker's name is celery@<hostname>.
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    depends_on:
      # web healthy = migrations are applied (docker-entrypoint.sh): a task
      # never meets a database without the new tables
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    # The scheduler: at the times of CELERY_BEAT_SCHEDULE (settings.py) it
    # puts the periodic tasks into the queue; the worker runs them.
    # Exactly ONE beat: two would put every periodic task in twice.
    <<: *django
    # --schedule: beat keeps the time of the last runs in a small file.
    # /app belongs to root (the "app" user can't write there), /tmp can;
    # the file is lost with the container, beat then just starts counting
    # from now (a missed run is not repeated).
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  stripe-cli:
    # Stripe can't reach http://localhost:8000 on your Mac from the internet.
    # The CLI keeps a connection to Stripe open (outgoing, no public URL
    # needed), receives the events of the account and repeats each one as
    # POST to the web service, with a valid "Stripe-Signature" header.
    # Only for development: in production Stripe calls a public HTTPS
    # endpoint registered in Dashboard -> Developers -> Webhooks.
    # A fixed version, like the other images.
    image: stripe/stripe-cli:v1.55.9
    environment:
      # The CLI logs in with the secret key from .env (test mode)
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    command:
      - listen
      # Inside the Docker network the site is "web", not localhost
      - --forward-to
      - web:8000/payments/webhook/stripe/
      # Only the events the site handles (StripeProvider.handle_webhook)
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    depends_on:
      web:
        condition: service_healthy

# Named volumes: Docker keeps them in its own storage.
#
# postgres_data and media_data are SHARED between the homework projects
# (hw_21, hw_22, ...): the same database and covers, no data transfer for
# every new homework.
#   name:     the real volume name, used as is. Without it compose adds the
#             project prefix (the folder name: hillel_hw_21_..._postgres_data),
#             so every new folder would get new empty volumes.
#   external: compose does not create or delete these volumes, it only uses
#             them: `docker compose down -v` can't wipe the shared database.
#             If a volume is missing, `up` stops with "external volume not
#             found". Create them once (a new machine, a fresh start):
#               docker volume create hillel_bookstore_postgres_data && docker volume create hillel_bookstore_media_data
#
# static_data stays per project: collectstatic fills it on every start.
volumes:
  postgres_data:
    name: hillel_bookstore_postgres_data
    external: true
  static_data:
  media_data:
    name: hillel_bookstore_media_data
    external: true
